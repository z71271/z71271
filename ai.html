<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 能力 | ZJY</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <style>
    /* ===== AI页面专属样式 ===== */
    .ai-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .ai-header {
      text-align: center;
      margin-bottom: 50px;
      padding: 30px 0;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    }

    .ai-header h1 {
      font-size: 2.2em;
      color: #00d4ff;
      margin-bottom: 10px;
    }

    .ai-header .subtitle {
      color: #888;
      font-size: 0.9em;
      letter-spacing: 1px;
    }

    .ai-section {
      margin-bottom: 40px;
      padding: 25px 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.3s;
    }

    .ai-section:hover {
      border-color: rgba(0, 212, 255, 0.25);
    }

    .ai-section h2 {
      color: #00d4ff;
      font-size: 1.3em;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-section .section-desc {
      color: #aaa;
      font-size: 0.9em;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* 工具链卡片 */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .tool-card {
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
    }

    .tool-card .tool-name {
      color: #eaeaea;
      font-size: 1em;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .tool-card .tool-desc {
      color: #888;
      font-size: 0.8em;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .tool-card .tool-status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 0.7em;
      font-weight: 500;
    }

    .status-deployed { background: rgba(0, 212, 255, 0.15); color: #00d4ff; }
    .status-connected { background: rgba(0, 255, 100, 0.15); color: #00ff64; }
    .status-developing { background: rgba(255, 200, 0, 0.15); color: #ffc800; }
    .status-planning { background: rgba(255, 255, 255, 0.08); color: #999; }

    /* 架构层级 */
    .arch-layers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .arch-layer {
      padding: 15px 20px;
      border-left: 3px solid #00d4ff;
      background: rgba(0, 212, 255, 0.03);
      border-radius: 0 6px 6px 0;
    }

    .arch-layer .layer-name {
      color: #00d4ff;
      font-size: 0.8em;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .arch-layer .layer-tools {
      color: #aaa;
      font-size: 0.85em;
    }

    /* 技能条 */
    .skill-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .skill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      font-size: 0.85em;
    }

    .skill-item .skill-name { color: #eaeaea; }
    .skill-item .skill-level { color: #00d4ff; font-weight: 500; }

    /* 项目卡片 */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project-card {
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.15);
    }

    .project-card .proj-name {
      color: #eaeaea;
      font-size: 1em;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .project-card .proj-desc {
      color: #888;
      font-size: 0.8em;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .project-card .proj-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .project-card .proj-tech span {
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(0, 212, 255, 0.1);
      color: #00d4ff;
      font-size: 0.7em;
    }

    .project-card .proj-link {
      color: #00d4ff;
      font-size: 0.8em;
      text-decoration: none;
    }

    .project-card .proj-link:hover {
      text-decoration: underline;
    }

    /* 规划中列表 */
    .plan-list {
      color: #888;
      font-size: 0.85em;
      line-height: 2;
      padding-left: 20px;
    }

    .plan-list li {
      margin-bottom: 4px;
    }

    .plan-list li::marker {
      color: #00d4ff;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .tool-grid { grid-template-columns: 1fr; }
      .skill-list { grid-template-columns: 1fr; }
      .ai-section { padding: 18px 15px; }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">&lt;<span>ZJY</span>/&gt;</a>
      <button class="nav-toggle" aria-label="菜单"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/tech.html">技术简历</a></li>
        <li><a href="/ai.html" class="active">AI 能力</a></li>
        <li><a href="/notes.html">笔记</a></li>
        <li><a href="/ai-resume.html">AI简历</a></li>
        <li><a href="/sales.html">销售简历</a></li>
        <li><a href="/contact.html">联系</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding-top: var(--nav-height);">
    <!-- 加载中 -->
    <div id="loading" style="text-align:center; padding:100px; color:#888;">
      <p>Loading...</p>
    </div>

    <!-- AI 内容区域 -->
    <div id="ai-content" class="ai-container" style="display:none;">
      <div class="ai-header">
        <h1 id="page-title">AI 能力</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div id="sections-container"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      &copy; 2026 郑敬耀 &mdash; Built with <a href="/admin/login.html">◆</a>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    fetch('/assets/data/ai.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('page-title').textContent = data.pageTitle;
        document.getElementById('page-subtitle').textContent = data.subtitle;
        renderSections(data.sections);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('ai-content').style.display = 'block';
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = '<p style="color:#ff5555;">数据加载失败，请稍后重试</p>';
        console.error('Failed to load ai.json:', err);
      });

    function renderSections(sections) {
      const container = document.getElementById('sections-container');
      sections.forEach(section => {
        const sectionEl = document.createElement('div');
        sectionEl.className = 'ai-section';
        sectionEl.id = section.id;
        sectionEl.innerHTML = `
          <h2>${section.icon || ''} ${section.title}</h2>
          <p class="section-desc">${section.content.text || ''}</p>
          ${renderSectionContent(section.content)}
        `;
        container.appendChild(sectionEl);
      });
    }

    function renderSectionContent(content) {
      let html = '';

      if (content.items && content.items.length > 0) {
        const isProject = content.items[0].tech !== undefined;
        const isToolCard = content.items[0].status !== undefined && content.items[0].description !== undefined;
        const isSkill = content.items[0].level !== undefined;

        if (isProject) {
          html += '<div class="project-list">';
          content.items.forEach(p => {
            const techTags = (p.tech || []).map(t => `<span>${t}</span>`).join('');
            const repo = p.repo ? `<a href="${p.repo}" class="proj-link" target="_blank">GitHub →</a>` : '';
            const statusClass = p.status === '已完成' ? 'status-deployed' : p.status === '开发中' ? 'status-developing' : 'status-planning';
            html += `
              <div class="project-card">
                <div class="proj-name">${p.name} <span class="tool-status ${statusClass}">${p.status}</span></div>
                <div class="proj-desc">${p.description}</div>
                <div class="proj-tech">${techTags}</div>
                ${repo}
              </div>
            `;
          });
          html += '</div>';
        } else if (isToolCard) {
          html += '<div class="tool-grid">';
          content.items.forEach(tool => {
            const statusClass = tool.status === '已部署' ? 'status-deployed' : tool.status === '已接入' ? 'status-connected' : tool.status === '开发中' ? 'status-developing' : 'status-planning';
            const link = tool.link ? `<br><a href="${tool.link}" target="_blank" style="color:#00d4ff;font-size:0.7em;text-decoration:none;">了解更多 →</a>` : '';
            html += `
              <div class="tool-card">
                <div class="tool-name">${tool.name} <span class="tool-status ${statusClass}">${tool.status}</span></div>
                <div class="tool-desc">${tool.description}${link}</div>
              </div>
            `;
          });
          html += '</div>';
        } else if (isSkill) {
          html += '<div class="skill-list">';
          content.items.forEach(skill => {
            html += `
              <div class="skill-item">
                <span class="skill-name">${skill.name}</span>
                <span class="skill-level">${skill.level}</span>
              </div>
            `;
          });
          html += '</div>';
        }
      }

      if (content.architecture) {
        html += '<div class="arch-layers">';
        content.architecture.layers.forEach(layer => {
          html += `
            <div class="arch-layer">
              <div class="layer-name">${layer.name}</div>
              <div class="layer-tools">${layer.tools.join(' &nbsp;|&nbsp; ')}</div>
            </div>
          `;
        });
        html += '</div>';
      }

      if (content.plan) {
        html += '<ul class="plan-list">';
        content.plan.forEach(item => {
          html += `<li>${item}</li>`;
        });
        html += '</ul>';
      }

      return html;
    }
  </script>
</body>
</html>
