server {
    listen 80;
    server_name localhost;

    # 网站根目录
    root /usr/share/nginx/html;
    index index.html;

    # 字符集
    charset utf-8;

    # Gzip压缩（加快加载速度）
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # 静态文件缓存（浏览器缓存30天）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 自定义404页面
    error_page 404 /404.html;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
    }
}
